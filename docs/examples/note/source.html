<h2 id="note-card-label" style="position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap">Note card</h2>
<style>
input:focus,textarea:focus,button:focus{outline:none}
#note-stamp[disabled]{opacity:0.45;cursor:default}
html[data-card-sizing="viewport"],html[data-card-sizing="viewport"] body{height:100%}
html[data-card-sizing="viewport"] body{display:flex;flex-direction:column}
html[data-card-sizing="viewport"] .card-column{flex:1;display:flex;flex-direction:column;min-height:0}
.card-column{max-width:752px;margin:0 auto;padding:0 16px 12px}

html[data-card-sizing="viewport"] .note-header{flex:none}
html[data-card-sizing="viewport"] .card-column{min-height:0}
.note-editor{display:flex;flex-direction:column;min-height:160px;flex:1}
.note-editor .note-body{flex:1;min-height:120px}
.note-footer{display:flex;align-items:center;justify-content:flex-end;gap:8px;padding:8px 0 12px;flex:none;font-family:var(--font-ui)}
#note-stamp-readout{min-width:0;text-align:right;line-height:1.4}
#note-stamp{flex:none}
.card-column{padding:0 20px;max-width:760px}
[data-persist="title"]::placeholder,.note-body::placeholder{color:var(--text-muted);opacity:0.65}
