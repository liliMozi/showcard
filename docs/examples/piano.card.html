    "CAPABILITY_NOT_SUPPORTED": "CARD_HOST_CAPABILITY_NOT_SUPPORTED",
    "TOOL_UNAVAILABLE": "CARD_HOST_TOOL_UNAVAILABLE",
    "TIMEOUT": "CARD_HOST_TIMEOUT",
    "POST_FAILED": "CARD_HOST_POST_FAILED",
    "INVALID_RESPONSE": "CARD_HOST_INVALID_RESPONSE",
    "STATE_TOO_LARGE": "CARD_HOST_STATE_TOO_LARGE",
    "STORAGE_UNAVAILABLE": "CARD_HOST_STORAGE_UNAVAILABLE",
    "STORAGE_FAILED": "CARD_HOST_STORAGE_FAILED",
    "CONTRACT_UNSUPPORTED": "CARD_HOST_CONTRACT_UNSUPPORTED",
    "RATE_LIMITED": "CARD_HOST_RATE_LIMITED",
    "TOOL_FAILED": "CARD_HOST_TOOL_FAILED",
    "INVALID_INPUT": "CARD_HOST_INVALID_INPUT",
    "NO_ROUTE": "CARD_HOST_EMIT_NO_ROUTE"

  "CAP": {
    "STATE_GET": "state.get",
    "STATE_SET": "state.set",
    "INVOKE": "invoke",
    "CAPABILITIES": "capabilities",
    "EMIT": "emit"

  "RESPONSE_TYPE": "card:response",

  // and a failure has to name its code. Anything else is an invalid response.
  function normalizeEnvelope(raw) {

    if (raw.ok === true) {
      return { ok: true, result: isPlainObject(raw.result) ? raw.result : {} };
    }
    if (raw.ok === false) {
      if (typeof raw.code !== 'string' || raw.code === '') { return null; }

        ok: false,
        code: raw.code,
        error: typeof raw.error === 'string' ? raw.error : raw.code,

      // section 2.6 for corrupt local storage, and refusing to open would break
      // the section 9.2 harmlessness guarantee.
      return { state: {} };

    if (!storage) {
      return fail(CODES.STORAGE_UNAVAILABLE, 'local storage is not available');
    }
    var key = storageKey();
    if (!key) {
      return fail(
        CODES.STORAGE_UNAVAILABLE,
        'no location path is available to derive a fallback storage key from'

    try {
      serialized = JSON.stringify(nextState);
    } catch (error) {
      return fail(CODES.STORAGE_FAILED, 'the state could not be serialized: ' + describe(error));

    var bindingId = element.getAttribute('data-invoke');
    if (!bindingId) { return; }

  function readControl(element) {
    if (element.type === 'checkbox') { return !!element.checked; }
    if (element.type === 'radio') { return element.checked ? element.value : undefined; }
    return element.value;
  }

  function writeControl(element, value) {
    if (element.type === 'checkbox') { element.checked = !!value; return; }
    if (element.type === 'radio') { element.checked = element.value === value; return; }
    element.value = value === null || value === undefined ? '' : String(value);
  }

  function hydratePersistedControls() {
    if (!doc || typeof doc.querySelectorAll !== 'function') { return; }
    var controls = doc.querySelectorAll('[data-persist]');
    if (!controls.length) { return; }
    window.card.state.get().then(function (envelope) {
      if (!envelope.ok) { return; }
      var state = isPlainObject(envelope.result.state) ? envelope.result.state : {};
      for (var i = 0; i < controls.length; i++) {
        var control = controls[i];
        if (!FORM_CONTROLS[control.tagName]) { continue; }
        var key = control.getAttribute('data-persist');
        if (key && Object.prototype.hasOwnProperty.call(state, key)) {
          writeControl(control, state[key]);
        }
      }
    });
  }

  if (doc && typeof doc.addEventListener === 'function') {
    doc.addEventListener('click', function (event) {
      var element = closestMatch(event.target, '[data-invoke]');
      if (!element) { return; }
      // Section 7.1: a card never submits a form outbound; the binding is the
      // only channel, so the native submission is cancelled here.
      if (typeof element.closest === 'function' && element.closest('form')) {
        event.preventDefault();
      }
      activateInvoker(element);
    }, true);

    doc.addEventListener('keydown', function (event) {
      if (event.key !== 'Enter') { return; }
      var element = closestMatch(event.target, '[data-invoke]');
      if (!element) { return; }
      // Buttons and links already turn Enter into a click; handling it again
      // here would fire the binding twice.
      if (NATIVELY_ACTIVATED[element.tagName]) { return; }
      event.preventDefault();
      activateInvoker(element);
    }, true);

    doc.addEventListener('change', function (event) {
      var element = event.target;
      if (!element || typeof element.getAttribute !== 'function') { return; }
      if (!FORM_CONTROLS[element.tagName]) { return; }
      var key = element.getAttribute('data-persist');
      if (!key) { return; }
      var value = readControl(element);
      if (value === undefined) { return; }
      window.card.state.set(key, value);
    }, true);

    if (doc.readyState === 'loading') {
      doc.addEventListener('DOMContentLoaded', hydratePersistedControls, { once: true });
    } else {
      hydratePersistedControls();
    }
  }
})();

<!-- No manifest block here, on purpose. Section 1.4: a card with no need to
     communicate with a host may omit the declaration entirely. This one asks for
     nothing — no state, no tools — so it declares nothing at all. Its identity
     is the host's business, assigned and held there, never written into the
     package (section 1.3). -->

<style>
  :root { color-scheme: light; }
  html, body { background: #faf7f2; }
  body {
    margin: 0;
    color: #2b2722;
    font-family: Georgia, "Iowan Old Style", "Times New Roman", serif;
    font-size: 15px;
    line-height: 1.6;
  }
  .pn { display: flex; flex-direction: column; padding: 22px 24px 20px; }
  .pn-title {
    margin: 0 0 14px;
    font-size: 11px;
    letter-spacing: 0.34em;
    text-transform: uppercase;
    color: #8a8174;
  }
  /* Laid out the way a keyboard stands on end: pitch rises upward, so the keys
     are stacked in reverse and C4 sits at the bottom. */
  .pn-keys {
    position: relative;
    display: flex;
    flex-direction: column-reverse;
    height: 420px;
    border: 1px solid #cec5b5;
    background: #fffdf9;
    touch-action: none;
  }
  .pn-white, .pn-black {
    appearance: none;
    font: inherit;
    border: 0;
    border-radius: 0;
    margin: 0;
    cursor: pointer;
    touch-action: none;
    display: flex;
    align-items: center;
  }
  .pn-white {
    position: relative;
    flex: 1 1 0;
    background: transparent;
    padding: 0 0 0 11px;
    justify-content: flex-start;
  }
  /* The seam hangs off the underside of every key but the lowest, so the bottom
     key never doubles its line against the frame's own border. */
  .pn-white + .pn-white { border-bottom: 1px solid #e4ddd1; }
  .pn-white.is-down { background: #f1e8d9; }
  .pn-black {
    position: absolute;
    right: 0;
    width: 60%;
    background: #2b2722;
    padding: 0 11px 0 0;
    justify-content: flex-end;
    z-index: 2;
  }
  .pn-black.is-down { background: #6d6357; }
  .pn-cap { font-size: 10px; letter-spacing: 0.1em; color: #b0a696; }
  .pn-black .pn-cap { color: #8d8577; }
  .pn-white:focus-visible, .pn-black:focus-visible { outline: 1px solid #537d96; outline-offset: -2px; }
  .pn-hint { margin: 12px 0 0; font-size: 11.5px; line-height: 1.5; color: #8a8174; }
  .pn-hint b { font-weight: 400; letter-spacing: 0.18em; color: #5d564b; }

  /* Section 1.7, as above: stretch only where the host says the frame decides. */
  html[data-card-sizing="viewport"],
  html[data-card-sizing="viewport"] body { height: 100%; }
  html[data-card-sizing="viewport"] body { overflow: hidden; }
  html[data-card-sizing="viewport"] .pn { height: 100%; box-sizing: border-box; }
  html[data-card-sizing="viewport"] .pn-keys { height: auto; flex: 1 1 0; min-height: 0; }
</style>

<div class="pn">
  <p class="pn-title">One octave</p>
  <div class="pn-keys" role="group" aria-label="Piano keys, C4 to C5">
    <button class="pn-white" type="button" data-note="C4" data-freq="261.63" data-key="a" aria-label="C4"><span class="pn-cap">A</span></button>
    <button class="pn-white" type="button" data-note="D4" data-freq="293.66" data-key="s" aria-label="D4"><span class="pn-cap">S</span></button>
    <button class="pn-white" type="button" data-note="E4" data-freq="329.63" data-key="d" aria-label="E4"><span class="pn-cap">D</span></button>
    <button class="pn-white" type="button" data-note="F4" data-freq="349.23" data-key="f" aria-label="F4"><span class="pn-cap">F</span></button>
    <button class="pn-white" type="button" data-note="G4" data-freq="392" data-key="g" aria-label="G4"><span class="pn-cap">G</span></button>
    <button class="pn-white" type="button" data-note="A4" data-freq="440" data-key="h" aria-label="A4"><span class="pn-cap">H</span></button>
    <button class="pn-white" type="button" data-note="B4" data-freq="493.88" data-key="j" aria-label="B4"><span class="pn-cap">J</span></button>
    <button class="pn-white" type="button" data-note="C5" data-freq="523.25" data-key="k" aria-label="C5"><span class="pn-cap">K</span></button>
    <button class="pn-black" type="button" style="bottom: 9.000%; height: 7.000%" data-note="C#4" data-freq="277.18" data-key="w" aria-label="C#4"><span class="pn-cap">W</span></button>
    <button class="pn-black" type="button" style="bottom: 21.500%; height: 7.000%" data-note="D#4" data-freq="311.13" data-key="e" aria-label="D#4"><span class="pn-cap">E</span></button>
    <button class="pn-black" type="button" style="bottom: 46.500%; height: 7.000%" data-note="F#4" data-freq="369.99" data-key="t" aria-label="F#4"><span class="pn-cap">T</span></button>
    <button class="pn-black" type="button" style="bottom: 59.000%; height: 7.000%" data-note="G#4" data-freq="415.3" data-key="y" aria-label="G#4"><span class="pn-cap">Y</span></button>
    <button class="pn-black" type="button" style="bottom: 71.500%; height: 7.000%" data-note="A#4" data-freq="466.16" data-key="u" aria-label="A#4"><span class="pn-cap">U</span></button>
  </div>
  <p class="pn-hint">Press a key, or play the row <b>a w s e d f t g y h u j k</b>.</p>
</div>

<script>
  /* Zero dependencies and no network: the sound is an oscillator per strike,
     built where it is heard. Nothing here leaves the document. */
  (function () {
    var keys = document.querySelectorAll('[data-freq]');
    var byLetter = {};
    var held = {};
    var context = null;
    var index;

    for (index = 0; index < keys.length; index += 1) {
      byLetter[keys[index].getAttribute('data-key')] = keys[index];
    }

    function audio() {
      if (context === null) {
        var Ctor = window.AudioContext || window.webkitAudioContext;
        if (!Ctor) { return null; }
        try { context = new Ctor(); } catch (error) { return null; }
      }
      if (context.state === 'suspended' && typeof context.resume === 'function') { context.resume(); }
      return context;
    }

    function strike(element) {
      var ac = audio();
      if (!ac) { return; }
      var frequency = parseFloat(element.getAttribute('data-freq'));
      if (!isFinite(frequency)) { return; }
      var at = ac.currentTime;
      var oscillator = ac.createOscillator();
      var softener = ac.createBiquadFilter();
      var envelope = ac.createGain();
      oscillator.type = 'triangle';
      oscillator.frequency.value = frequency;
      softener.type = 'lowpass';
      softener.frequency.value = 2200;
      envelope.gain.setValueAtTime(0.0001, at);
      envelope.gain.exponentialRampToValueAtTime(0.11, at + 0.014);
      envelope.gain.exponentialRampToValueAtTime(0.0001, at + 0.85);
      oscillator.connect(softener);
      softener.connect(envelope);
      envelope.connect(ac.destination);
      oscillator.start(at);
      oscillator.stop(at + 0.9);
    }

    function press(element) {
      if (!element || element.classList.contains('is-down')) { return; }
      element.classList.add('is-down');
      strike(element);
    }

    function release(element) {
      if (element) { element.classList.remove('is-down'); }
    }

    function keyUnder(target) {
      return target && typeof target.closest === 'function' ? target.closest('[data-freq]') : null;
    }

    document.addEventListener('pointerdown', function (event) {
      var element = keyUnder(event.target);
      if (!element) { return; }
      // Keep the press from turning into a text selection or a scroll gesture;
      // several fingers at once are several independent notes.
      event.preventDefault();
      held[event.pointerId] = element;
      press(element);
    });

    // Sliding along the keyboard sounds each key it crosses. The element under
    // the pointer is looked up by position rather than taken from the event,
    // because a touch keeps delivering its moves to the key it started on.
    document.addEventListener('pointermove', function (event) {
      if (!Object.prototype.hasOwnProperty.call(held, event.pointerId)) { return; }
      var element = keyUnder(document.elementFromPoint(event.clientX, event.clientY));
      if (element === held[event.pointerId]) { return; }
      release(held[event.pointerId]);
      if (element) {
        held[event.pointerId] = element;
        press(element);
      } else {
        delete held[event.pointerId];
      }
    });

    function lift(event) {
      var element = held[event.pointerId];
      if (!element) { return; }
      delete held[event.pointerId];
      release(element);
    }

    document.addEventListener('pointerup', lift);
    document.addEventListener('pointercancel', lift);

    // A key reached by Tab and activated with Enter or Space arrives as a click
    // with no pointer behind it (detail 0), which the pointer path never sees.
    document.addEventListener('click', function (event) {
      if (event.detail !== 0) { return; }
      var element = keyUnder(event.target);
      if (!element) { return; }
      press(element);
      window.setTimeout(function () { release(element); }, 150);
    });

    document.addEventListener('keydown', function (event) {
      if (event.repeat || event.metaKey || event.ctrlKey || event.altKey) { return; }
      var element = byLetter[String(event.key || '').toLowerCase()];
      if (!element) { return; }
      event.preventDefault();
      press(element);
    });

    document.addEventListener('keyup', function (event) {
      release(byLetter[String(event.key || '').toLowerCase()]);
    });
  })();
</script>

</body>
</html>
