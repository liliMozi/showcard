<script>/* showcard reference injection layer */
(function () {
  'use strict';

  // Section 6.2 / 2.2: first definition wins. A host injects before the file's
  // own shim, so the shim finds window.card already there and steps aside.
  if (window.card) { return; }

  var K = {
  "CODES": {
    "CAPABILITY_REQUIRED": "CARD_HOST_CAPABILITY_REQUIRED",
    "CAPABILITY_NOT_SUPPORTED": "CARD_HOST_CAPABILITY_NOT_SUPPORTED",
    "TOOL_UNAVAILABLE": "CARD_HOST_TOOL_UNAVAILABLE",
    "TIMEOUT": "CARD_HOST_TIMEOUT",
    "POST_FAILED": "CARD_HOST_POST_FAILED",
    "INVALID_RESPONSE": "CARD_HOST_INVALID_RESPONSE",
    "STATE_TOO_LARGE": "CARD_HOST_STATE_TOO_LARGE",
    "STORAGE_UNAVAILABLE": "CARD_HOST_STORAGE_UNAVAILABLE",
    "STORAGE_FAILED": "CARD_HOST_STORAGE_FAILED",
    "CONTRACT_UNSUPPORTED": "CARD_HOST_CONTRACT_UNSUPPORTED",
    "RATE_LIMITED": "CARD_HOST_RATE_LIMITED",
    "TOOL_FAILED": "CARD_HOST_TOOL_FAILED",
    "INVALID_INPUT": "CARD_HOST_INVALID_INPUT",
    "NO_ROUTE": "CARD_HOST_EMIT_NO_ROUTE"
  },
  "CAP": {
    "STATE_GET": "state.get",
    "STATE_SET": "state.set",
    "INVOKE": "invoke",
    "CAPABILITIES": "capabilities",
    "EMIT": "emit"
  },
  "REQUEST_TYPE": "card:request",
  "RESPONSE_TYPE": "card:response",
  "TIMEOUT_MS": 5000,
  "STATE_BUDGET_BYTES": 65536,
  "STATE_KEY_PREFIX": "card-state:"

  var CODES = K.CODES;
  var CAP = K.CAP;
  var doc = window.document;
  var requestCounter = 0;

  function isPlainObject(value) {
    return value !== null && typeof value === 'object' && !Array.isArray(value);
  }

  function describe(error) {
    if (!error) { return 'unknown error'; }
    if (typeof error === 'string') { return error; }
    return String(error.message || error);
  }

  function ok(result) {
    return { ok: true, result: isPlainObject(result) ? result : {} };
  }

  function fail(code, error) {
    return { ok: false, code: code, error: error || code, result: {} };
  }

  // and a failure has to name its code. Anything else is an invalid response.
  function normalizeEnvelope(raw) {
    if (!raw || typeof raw !== 'object') { return null; }
    if (raw.ok === true) {
      return { ok: true, result: isPlainObject(raw.result) ? raw.result : {} };
    }
    if (raw.ok === false) {
      if (typeof raw.code !== 'string' || raw.code === '') { return null; }
      return {
        ok: false,
        code: raw.code,
        error: typeof raw.error === 'string' ? raw.error : raw.code,
        result: isPlainObject(raw.result) ? raw.result : {}

    }

    for (var i = 0; i < text.length; i++) {
      var code = text.charCodeAt(i);
      if (code < 0x80) { bytes += 1; }
      else if (code < 0x800) { bytes += 2; }
      else if (code >= 0xd800 && code <= 0xdbff) { bytes += 4; i++; }

    return bytes;

  // no id of its own to key a fallback store by. Section 2.5 derives the key
  // from the document's own address instead — location.pathname or an
  // equivalent stable identifier — which is exactly how a plain web page's

    }

    } catch (error) {

    }

      return { error: fail(CODES.STORAGE_UNAVAILABLE, 'local storage is not available') };

          'no location path is available to derive a fallback storage key from'

    } catch (error) {
      return { error: fail(CODES.STORAGE_UNAVAILABLE, 'local storage read failed: ' + describe(error)) };

      // the section 9.2 harmlessness guarantee.
      return { state: {} };

    if (!storage) {
      return fail(CODES.STORAGE_UNAVAILABLE, 'local storage is not available');
    }
    var key = storageKey();
    if (!key) {
      return fail(
        CODES.STORAGE_UNAVAILABLE,
        'no location path is available to derive a fallback storage key from'
      );
    }
    var serialized;
    try {
      serialized = JSON.stringify(nextState);
    } catch (error) {
      return fail(CODES.STORAGE_FAILED, 'the state could not be serialized: ' + describe(error));
    }
    // Section 2.5: refuse, never truncate.
    if (byteLength(serialized) > K.STATE_BUDGET_BYTES) {

        'the serialized state exceeds the ' + K.STATE_BUDGET_BYTES + ' byte budget'

    }
    try {
      storage.setItem(key, serialized);

      return fail(CODES.STORAGE_FAILED, 'local storage write failed: ' + describe(error));
    }

    if (isPlainObject(payload.state)) {
      return writeLocalState(payload.state);

    if (typeof payload.key === 'string' && payload.key !== '') {

      if (read.error) { return read.error; }

      }

      return writeLocalState(next);

    return fail(CODES.INVALID_INPUT, 'state.set needs a key and a value, or a whole state object');

  function standaloneCapabilities() {

      capabilities: { state: 'local_fallback', invoke: 'requires_host', emit: 'requires_host' }

  }

    if (capability === CAP.CAPABILITIES) { return standaloneCapabilities(); }

    // tool channel.

      return fail(CODES.CAPABILITY_NOT_SUPPORTED, 'this card is open without a host, so emit is not available');

    return fail(CODES.TOOL_UNAVAILABLE, 'this card is open without a host, so there is no tool channel');
  }

  // Section 2.8: postMessage, card: prefix, paired by requestId.
  function requestFromHost(capability, payload) {
    return new Promise(function (resolve) {
      requestCounter += 1;

      var settled = false;

        settle(envelope || fail(CODES.INVALID_RESPONSE, 'the host answer is not a valid envelope'));

        window.parent.postMessage({
          type: K.REQUEST_TYPE,
          requestId: requestId,
          capability: capability,
          payload: payload === undefined ? null : payload

      } catch (error) {
        settle(fail(CODES.POST_FAILED, 'the request could not be delivered: ' + describe(error)));
        return;
      }

      timer = window.setTimeout(function () {
        settle(fail(CODES.TIMEOUT, 'the host did not answer within ' + K.TIMEOUT_MS + ' ms'));
      }, K.TIMEOUT_MS);
    });
  }

  // Section 2.3: one dispatch point, five named conveniences on top of it.
  function request(capability, payload) {
    if (typeof capability !== 'string' || capability === '') {
      return Promise.resolve(fail(CODES.CAPABILITY_REQUIRED, 'a capability name is required'));
    }
    if (window.parent !== window) {
      return requestFromHost(capability, payload);
    }
    return Promise.resolve(requestStandalone(capability, payload));
  }

  // Section 2.3: userGesture is collected here. Authors cannot fill it;
  // a host that routes emit must ignore a value the author wrote.
  function readUserGesture() {
    try {
      if (window.navigator && window.navigator.userActivation && typeof window.navigator.userActivation.isActive === 'boolean') {
        return window.navigator.userActivation.isActive === true;
      }
    } catch (err) {}

      return !!(window.event && window.event.isTrusted);
    } catch (err) {}

  }

    state: {
      get: function (key) {
        if (key === undefined || key === null) { return request(CAP.STATE_GET, { key: null }); }
        if (typeof key !== 'string' || key === '') {
          return Promise.resolve(fail(CODES.INVALID_INPUT, 'state.get takes a string key, or nothing at all'));
        }

      },
      set: function (keyOrState, value) {
        if (typeof keyOrState === 'string' && keyOrState !== '') {

        }

        }
        return Promise.resolve(
          fail(CODES.INVALID_INPUT, 'state.set takes (key, value) or a whole state object')

      }
    },
    invoke: function (bindingId, input) {

        return Promise.resolve(fail(CODES.INVALID_INPUT, 'invoke takes a binding id declared in the manifest'));

  var NATIVELY_ACTIVATED = { BUTTON: true, A: true, INPUT: true, SELECT: true, TEXTAREA: true };

  // textContent only: the injection layer never writes markup into the card.
  function renderResult(bindingId, envelope) {
    if (!doc || typeof doc.querySelectorAll !== 'function') { return; }

    var text = textify(envelope && envelope.result);
    for (var i = 0; i < targets.length; i++) {

    }

  function activateInvoker(element) {
    var bindingId = element.getAttribute('data-invoke');
    if (!bindingId) { return; }
    var form = typeof element.closest === 'function' ? element.closest('form') : null;
    var input = form ? serializeForm(form) : undefined;
    window.card.invoke(bindingId, input).then(function (envelope) {
      renderResult(bindingId, envelope);
    });
  }

  function readControl(element) {
    if (element.type === 'checkbox') { return !!element.checked; }
    if (element.type === 'radio') { return element.checked ? element.value : undefined; }
    return element.value;
  }

  function writeControl(element, value) {
    if (element.type === 'checkbox') { element.checked = !!value; return; }
    if (element.type === 'radio') { element.checked = element.value === value; return; }
    element.value = value === null || value === undefined ? '' : String(value);
  }

  function hydratePersistedControls() {
    if (!doc || typeof doc.querySelectorAll !== 'function') { return; }
    var controls = doc.querySelectorAll('[data-persist]');
    if (!controls.length) { return; }
    window.card.state.get().then(function (envelope) {
      if (!envelope.ok) { return; }
      var state = isPlainObject(envelope.result.state) ? envelope.result.state : {};
      for (var i = 0; i < controls.length; i++) {
        var control = controls[i];
        if (!FORM_CONTROLS[control.tagName]) { continue; }
        var key = control.getAttribute('data-persist');
        if (key && Object.prototype.hasOwnProperty.call(state, key)) {
          writeControl(control, state[key]);
        }
      }
    });
  }

  if (doc && typeof doc.addEventListener === 'function') {
    doc.addEventListener('click', function (event) {
      var element = closestMatch(event.target, '[data-invoke]');
      if (!element) { return; }
      // Section 7.1: a card never submits a form outbound; the binding is the
      // only channel, so the native submission is cancelled here.
      if (typeof element.closest === 'function' && element.closest('form')) {
        event.preventDefault();
      }
      activateInvoker(element);
    }, true);

    doc.addEventListener('keydown', function (event) {
      if (event.key !== 'Enter') { return; }
      var element = closestMatch(event.target, '[data-invoke]');
      if (!element) { return; }
      // Buttons and links already turn Enter into a click; handling it again
      // here would fire the binding twice.
      if (NATIVELY_ACTIVATED[element.tagName]) { return; }
      event.preventDefault();
      activateInvoker(element);
    }, true);

    doc.addEventListener('change', function (event) {
      var element = event.target;
      if (!element || typeof element.getAttribute !== 'function') { return; }
      if (!FORM_CONTROLS[element.tagName]) { return; }
      var key = element.getAttribute('data-persist');
      if (!key) { return; }
      var value = readControl(element);
      if (value === undefined) { return; }
      window.card.state.set(key, value);
    }, true);

    if (doc.readyState === 'loading') {
      doc.addEventListener('DOMContentLoaded', hydratePersistedControls, { once: true });
    } else {
      hydratePersistedControls();
    }
  }
})();

<script>(function () {

  window.__cardPlaceholderInstalled = true;

  var MARKER = "data-card-placeholder";
  var REASON = "This resource is no longer where it was";
  var SVG_NS = 'http://www.w3.org/2000/svg';
  /* Above this width the slot has room for a sentence; at or below it the
     placeholder is standing in for an avatar or an icon and says less. */

    'justify-content:center;gap:.35em;max-width:100%;min-width:2.5em;min-height:2.5em;padding:.75em;',
    'border:1px solid var(--rule,rgba(128,128,128,.35));border-radius:8px;',
    'background:var(--well,rgba(128,128,128,.08));color:var(--ink,inherit);text-align:center;overflow:hidden}',
    '.card-placeholder--compact{gap:.2em;padding:.35em;border-radius:6px}',
    '.card-placeholder__icon{width:28px;height:28px;flex:none;opacity:.55}',
    '.card-placeholder--compact .card-placeholder__icon{width:18px;height:18px}',
    '.card-placeholder__alt{font-size:.86rem;line-height:1.3}',
    '.card-placeholder__reason{font-size:.72rem;line-height:1.3;opacity:.65;color:var(--muted,inherit)}'

    var style = document.createElement('style');
    style.id = 'card-placeholder-style';
    style.textContent = CSS;

     already knows means "there was an image here". */

      'class': 'card-placeholder__icon',

      'stroke-linecap': 'round',
      'stroke-linejoin': 'round',
      'aria-hidden': 'true'

    root.appendChild(svg('path', { d: 'M5 17.2l4.3-4.7 3.1 3.2L16 12l3 3.4' }));
    root.appendChild(svg('circle', { cx: '9', cy: '9.4', r: '1.4' }));

  }

    var declaredHeight = parseFloat(node.getAttribute('height'));

      width: isFinite(declaredWidth) && declaredWidth > 0 ? declaredWidth : (rect && rect.width > 1 ? rect.width : 0),
      height: isFinite(declaredHeight) && declaredHeight > 0 ? declaredHeight : (rect && rect.height > 1 ? rect.height : 0)
    };

    var alt = node.getAttribute ? (node.getAttribute('alt') || '') : '';
    var compact = size.width > 0 && size.width <= COMPACT_MAX_PX;

    var box = document.createElement('div');
    box.setAttribute(MARKER, '');
    box.setAttribute('role', 'img');
    box.className = compact ? 'card-placeholder card-placeholder--compact' : 'card-placeholder';
    box.setAttribute('aria-label', alt ? alt + '. ' + REASON : REASON);
    if (size.width > 0) { box.style.width = size.width + 'px'; }
    if (size.width > 0 && size.height > 0) {
      box.style.aspectRatio = size.width + ' / ' + size.height;
    } else if (size.height > 0) {
      box.style.height = size.height + 'px';
    }

    box.appendChild(icon());
    if (alt) {
      var altLine = document.createElement('span');
      altLine.className = 'card-placeholder__alt';
      altLine.textContent = alt;
      box.appendChild(altLine);

    /* The reason line is dropped in a compact slot only when the alt text is
       already carrying the message; with no alt there would be nothing left. */
    if (!compact || !alt) {
      var reasonLine = document.createElement('span');
      reasonLine.className = 'card-placeholder__reason';
      reasonLine.textContent = REASON;
      box.appendChild(reasonLine);
    }
    return box;
  }

  function replace(node) {
    if (!node || node.__cardPlaceholderDone || !node.parentNode) { return; }
    node.__cardPlaceholderDone = true;

  /* A <source> that fails inside a <picture> is not a failure the reader sees:
     the browser moves on to the next candidate and the <img> reports for the
     whole element if nothing works. Inside a media element there is no such
     spokesman, so the parent is examined once the browser has settled — and
     only replaced if it ended up with no usable source at all. */

    if (!parent || !parent.tagName) { return; }
    var tag = parent.tagName.toUpperCase();
    if (tag !== 'VIDEO' && tag !== 'AUDIO') { return; }
    window.setTimeout(function () {

    }, 0);
  }

  /* Resource errors do not bubble; the capture phase is the only place a single
     listener can see all of them. */
  window.addEventListener('error', function (event) {
    var node = event.target;
    if (!node || node === window || !node.tagName) { return; }
    var tag = node.tagName.toUpperCase();
    if (tag === 'IMG' || tag === 'VIDEO' || tag === 'AUDIO') {
      replace(node);
      return;
    }
    if (tag === 'SOURCE') { considerSourceParent(node.parentNode); }
  }, true);
})();</script>

:root{color-scheme:light;--bg:#F8F4ED;--bg-card:#FCFAF5;--text:#3B3D3F;--text-light:#68655F;--text-muted:#8A847A;--border:#E3DED2;--accent:#537D96;--accent-hover:#42657B;--accent-light:rgba(83,125,150,.1);--overlay-subtle:rgba(59,61,63,.04);--font-serif:Georgia,'Songti SC','Noto Serif CJK SC',serif;--font-ui:-apple-system,BlinkMacSystemFont,'PingFang SC','Hiragino Sans','Malgun Gothic',sans-serif;--font-mono:ui-monospace,SFMono-Regular,monospace;--radius-card:12px;--control-radius:8px;--corner-radius-scale:1}
*{box-sizing:border-box}html,body{margin:0;padding:0;background:var(--bg-card);color:var(--text);font-family:var(--font-serif);font-size:15px;line-height:1.6}button,input,textarea{font:inherit}button:focus-visible,input:focus-visible,textarea:focus-visible{outline:2px solid var(--accent)!important;outline-offset:2px}[hidden]{display:none!important}
html[data-card-sizing="viewport"] body{overflow:auto}
html[data-card-sizing="viewport"] .weather-hero{max-height:calc(100% - 180px);min-height:180px}
</style>

<h2 id="todo-card-label" style="position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap">To-do card</h2>
<style>
.card-column{font-family:var(--font-ui)}
.todo-heading{display:flex;align-items:center;gap:12px;margin:24px 0 20px}
.todo-heading input{flex:1;min-width:0}
.todo-heading #todo-title{font-size:26px;line-height:1.3}
#todo-progress{font-size:12px;color:var(--accent);background:var(--overlay-subtle,rgba(0,0,0,0.03));padding:5px 9px;border-radius:calc(8px * var(--corner-radius-scale,1));corner-shape:squircle;white-space:nowrap}
.todo-list{list-style:none;padding:0;margin:0}
.todo-item{display:flex;align-items:center;gap:12px;padding:13px 0}
.todo-box{appearance:none;-webkit-appearance:none;position:relative;flex:none;width:18px;height:18px;margin:0;border:1px solid var(--border);border-radius:calc(5px * var(--corner-radius-scale, 1));corner-shape:squircle;background:var(--bg-card);cursor:pointer}
.todo-box:checked{border-color:var(--accent);background:var(--accent)}
.todo-box:checked:after{content:'';position:absolute;left:5px;top:2px;width:4px;height:8px;border:solid var(--bg-card);border-width:0 1.5px 1.5px 0;transform:rotate(45deg)}
.todo-text{flex:1;min-width:0;font-family:var(--font-ui);font-size:14px;line-height:1.7;color:var(--text);word-break:break-word}
.todo-done .todo-text{color:var(--text-muted);text-decoration:line-through}
.todo-drop{flex:none;margin-top:2px;border:none;background:transparent;color:var(--text-muted);padding:2px;cursor:pointer;opacity:0;transition:opacity 0.12s ease}
.todo-item:hover .todo-drop,.todo-drop:focus{opacity:1}
.todo-entry{display:flex;align-items:center;gap:8px;margin-top:20px}
.todo-field{flex:1;min-width:0;height:36px;border:1px solid var(--border);border-radius:calc(10px * var(--corner-radius-scale, 1));corner-shape:squircle;background:var(--bg-card);font-family:var(--font-ui);font-size:0.85rem;color:var(--text);padding:0 12px}
.todo-field::placeholder{color:var(--text-muted)}
.todo-button{display:flex;align-items:center;justify-content:center;flex:none;width:36px;height:36px;border:none;border-radius:calc(12px * var(--corner-radius-scale, 1));corner-shape:squircle;background:var(--overlay-subtle, rgba(0,0,0,0.04));color:var(--text);padding:0;font-family:var(--font-ui);font-size:1.3rem;font-weight:400;cursor:pointer}
.todo-button:hover{background:var(--accent-light)}
.todo-field[disabled],.todo-button[disabled]{opacity:0.45;cursor:default}
input:focus,textarea:focus,button:focus{outline:none}
html[data-card-sizing="viewport"],html[data-card-sizing="viewport"] body{height:100%}
html[data-card-sizing="viewport"] body{display:flex;flex-direction:column}
html[data-card-sizing="viewport"] .card-column{flex:1;display:flex;flex-direction:column;min-height:0}
.card-column{max-width:512px;margin:0 auto;padding:12px 16px}
html[data-card-sizing="viewport"] .card-column{width:100%;margin:0 auto}
html[data-card-sizing="viewport"] .todo-list{flex:1;min-height:0;overflow-y:auto}
</style>
<div class="card-column">
<div class="todo-heading">
<input id="todo-title" data-persist="title" aria-label="List title" value="Today" style="display:block;width:100%;border:none;background:transparent;font-family:var(--font-serif);font-weight:500;color:var(--text);text-align:left;margin:0">
<p id="todo-progress" style="flex:none;text-align:right;line-height:1.4;margin:0"></p>
</div>
<ul id="todo-list" class="todo-list"></ul>
<p id="todo-empty" style="font-size:0.85rem;color:var(--text-muted);margin:0.2rem 0"></p>
<div class="todo-entry">
<input id="todo-field" class="todo-field" type="text" aria-label="New item" placeholder="Add an item" disabled>
<button id="todo-add" class="todo-button" type="button" aria-label="Add" disabled>+</button>
</div>
<p id="todo-notice" style="font-size:0.75rem;color:var(--text-muted);margin:0.5rem 0 0"></p>
</div>

    row.appendChild(box);
    row.appendChild(label);
    if (editable) {
      var drop = document.createElement('button');
      drop.type = 'button';
      drop.className = 'todo-drop';
      drop.setAttribute('aria-label', ui.t('todo.remove', { text: entry.text }));
      drop.innerHTML = REMOVE_ICON;
      drop.addEventListener('click', function () { removeItem(index); });
      row.appendChild(drop);
    }
    return row;
  }
  function render() {
    while (list.firstChild) list.removeChild(list.firstChild);
    var done = 0;
    for (var i = 0; i < items.length; i += 1) {
      if (items[i].done) done += 1;
      list.appendChild(buildRow(items[i], i));
    }
    progress.textContent = items.length ? done + ' / ' + items.length : '';
    empty.textContent = items.length || !loaded ? '' : ui.t('todo.empty');
    field.disabled = !editable;
    addButton.disabled = !editable;
    notice.textContent = requiresPin ? ui.t('todo.pin') : '';
  }
  addButton.addEventListener('click', addItem);
  field.addEventListener('keydown', function (event) {
    if (event.key !== 'Enter') return;
    event.preventDefault();
    addItem();
  });
  render();
  if (api && typeof api.capabilities === 'function') {
    api.capabilities().then(function (envelope) {
      var result = envelope && envelope.ok === true ? envelope.result : null;
      var capabilities = result && result.capabilities ? result.capabilities : null;
      var word = capabilities && typeof capabilities.state === 'string' ? capabilities.state : '';
      editable = word === 'available' || word === 'local_fallback';
      requiresPin = word === 'requires_pin';
      var trackEntry = capabilities && capabilities.track;
      var trackStatus = trackEntry && typeof trackEntry === 'object' ? trackEntry.status : '';
      trackAvailable = trackStatus === 'available' || trackStatus === 'local_fallback';
      render();
    }, function () { render(); });
  }
  if (api && api.state && typeof api.state.get === 'function') {
    api.state.get().then(function (envelope) {
      var result = envelope && envelope.ok === true ? envelope.result : null;
      var stored = result && result.state ? result.state.items : null;
      loaded = true;
      if (Object.prototype.toString.call(stored) === '[object Array]') items = normalizeItems(stored);
      render();
    }, function () { loaded = true; render(); });
  } else {
    loaded = true;
    render();
  }
})();
</script>
</body>
