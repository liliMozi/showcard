<h2 id="weather-card-label" style="position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap">Weather card</h2>
<style>
.weather-hero{position:relative;display:block;width:calc(100% - 12px);aspect-ratio:4/3;margin:6px 6px 16px;overflow:hidden;border-radius:calc(var(--radius-card, 8px) * var(--corner-radius-scale, 1));corner-shape:squircle}
.weather-hero:empty{display:none}
.weather-sky{position:absolute;inset:0;width:100%;height:100%;display:block;background-position:center;background-size:cover;background-repeat:no-repeat;transition:opacity 360ms ease}
@media (prefers-reduced-motion:reduce){.weather-sky{transition:none}}
.weather-scrim{position:absolute;inset:0;pointer-events:none}
.weather-hero-type{position:absolute;inset:0;display:flex;flex-direction:column;padding:20px 24px 24px}
.weather-place{font-family:var(--font-serif);font-size:24px;letter-spacing:0.34em;text-indent:0.34em;margin:0 0 auto}
.weather-now{font-family:var(--font-serif);font-size:4.8rem;font-weight:200;line-height:1;font-variant-numeric:lining-nums tabular-nums;margin:0}
.weather-word{font-family:var(--font-ui);font-size:1.05rem;line-height:1.4;margin:8px 0 0}
.weather-meta{font-family:var(--font-ui);font-size:0.82rem;line-height:1.4;opacity:0.8;margin:4px 0 0;padding-right:28px}
.weather-days{list-style:none;margin:0;padding:0;font-family:var(--font-ui)}
.weather-day{display:flex;align-items:center;gap:16px;min-height:40px;line-height:1.4;margin:0;padding:8px 0}
.weather-day-name{flex:1;font-family:var(--font-ui);font-size:0.9rem;color:var(--text-light)}
.weather-icon{display:block;flex:none;width:20px;height:20px;color:var(--text-light)}
.weather-range{flex:none;min-width:5rem;text-align:right;font-family:var(--font-ui);font-size:0.95rem;font-variant-numeric:lining-nums tabular-nums;color:var(--text)}
.weather-button{position:absolute;right:12px;bottom:12px;display:flex;align-items:center;justify-content:center;width:32px;height:32px;border:none;border-radius:calc(var(--radius-card,8px) * var(--corner-radius-scale, 1));corner-shape:squircle;background:var(--bg-card);color:var(--text);padding:6px;font-family:var(--font-ui);cursor:pointer}
.weather-button:hover{background:var(--bg)}
.weather-button[disabled]{opacity:0.45;cursor:default}
.weather-button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
@media (hover:hover) and (pointer:fine){
.weather-button,.weather-button[disabled]{opacity:0;pointer-events:none}
.weather-hero:hover .weather-button,.weather-hero:focus-within .weather-button{opacity:1;pointer-events:auto}
.weather-hero:hover .weather-button[disabled],.weather-hero:focus-within .weather-button[disabled]{opacity:0.45}
}
.weather-controls{display:flex;align-items:center;justify-content:flex-end;gap:8px;margin-top:8px}
.weather-stamp{margin:0;font-family:var(--font-ui);font-size:0.75rem;line-height:1.4;color:var(--text-muted)}
.weather-waiting{font-family:var(--font-ui);font-size:0.9rem;line-height:1.9;color:var(--text-muted);margin:0.7rem 0}
.weather-notice{font-family:var(--font-ui);font-size:0.8rem;color:var(--text-muted);margin:0.5rem 0 0}
input:focus,textarea:focus,button:focus{outline:none}
html[data-card-sizing="viewport"],html[data-card-sizing="viewport"] body{height:100%}
html[data-card-sizing="viewport"] body{display:flex;flex-direction:column}
html[data-card-sizing="viewport"] .card-column{flex:1;display:flex;flex-direction:column;min-height:0}
.card-column{max-width:512px;margin:0 auto;padding:0 16px 12px}
html[data-card-sizing="viewport"] .card-column{width:100%;margin:0 auto}
html[data-card-sizing="viewport"] .weather-hero{flex:none}
html[data-card-sizing="viewport"] .weather-face{flex:1;min-height:0;display:flex;flex-direction:column}
html[data-card-sizing="viewport"] .weather-reading{flex:1;min-height:0;display:flex;flex-direction:column}
html[data-card-sizing="viewport"] .weather-controls{margin-top:auto}
</style>

    request(placeUrl(place.name)).then(function (envelope) {
      busy = false;
      var payload = bodyIn(envelope);
      var found = payload ? coordsIn(payload) : null;
      if (!found) {
        message = payload === null ? FAILED : NOT_FOUND;
        render();
        return;
      }
      place = { name: place.name, latitude: found.latitude, longitude: found.longitude };
      message = '';
      persist();
      load();
    }, function () {
      busy = false;
      message = FAILED;
      render();
    });
  }
  // The one entry point, and the whole of the card's decision about what to do
  // with the place it was cast with: no place at all is a card that says one
  // line and asks the network for nothing; a name without coordinates gets
  // them; anything else goes straight for the weather.
  function start() {
    if (!place) return;
    if (place.latitude === null || place.longitude === null) return resolve();
    load();
  }
  function load() {
    if (!place || busy || !reachable || !api || typeof api.invoke !== 'function') return;
    busy = true;
    message = WORKING;
    render();
    request(forecastUrl(place)).then(function (envelope) {
      busy = false;
      var fresh = snapshotOf(bodyIn(envelope));
      if (fresh) {
        reading = fresh;
        fetchedAt = Date.now();
        message = '';
        persist();
      } else {
        message = FAILED;
      }
      render();
    }, function () {
      busy = false;
      message = FAILED;
      render();
    });
  }
  // A card cast with nowhere to look. It says the one thing that would fix it
  // and stops there: no field, no key, and no request. Somebody has to decide
  // where this card looks, and it is not the card.
  function buildWaiting() {
    return element('p', 'weather-waiting', UNPLACED);
  }
  // Weekday, picture, figures — written in the order they are read, which is
  // also the order they stand in. The picture is between the two on purpose:
  // it belongs to the reading rather than to the date, and the style block
  // gives the weekday the slack so that pairing travels to the right rim.
  // A day whose code the card cannot name simply has no picture, and the row
  // closes up rather than holding a gap for one.
  function dayRow(day) {
    var row = element('li', 'weather-day');
    row.appendChild(element('span', 'weather-day-name', weekdayLabel(day.date)));
    var icon = conditionIcon(weatherGroup(day.code));
    if (icon) row.insertAdjacentHTML('beforeend', icon);
    row.appendChild(element('span', 'weather-range', degrees(day.high) + ' / ' + degrees(day.low)));
    return row;
  }
  // One key, and the moment the reading landed. The refresh names its own fill
  // and stroke rather than leaving them to the style block, because one of the
  // two variants draws its rows with pictures that carry their own — a rule
  // stating them for every icon on the card would overrule those, since a
  // stylesheet outranks an attribute written on the shape.
  function buildControls() {
    var row = element('div', 'weather-controls');
    var refresh = button('weather-button', '');
    refresh.setAttribute('aria-label', REFRESH_LABEL);
    refresh.disabled = !reachable || busy;
    refresh.innerHTML = '<svg viewBox="0 0 24 24" role="img" class="weather-icon" fill="none"'
      + ' stroke="currentColor" stroke-width="1.5"><title>'
      + REFRESH_LABEL + '</title>' + REFRESH_SHAPE + '</svg>';
    refresh.addEventListener('click', load);
    row.appendChild(refresh);
    row.appendChild(element('small', 'weather-stamp', fetchedAt ? UPDATED + timeText(fetchedAt) : ''));
    return row;
  }
  document.getElementById('weather-card-label').textContent = ui.t('weather.card');
  REFRESH_LABEL = ui.t('weather.refresh'); WORKING = ui.t('weather.working'); FAILED = ui.t('weather.failed'); NOT_FOUND = ui.t('weather.notFound'); NEEDS_HOST = ui.t('weather.host'); UNPLACED = ui.t('weather.unplaced'); UPDATED = ui.t('weather.updated'); WIND = ui.t('weather.wind'); HUMIDITY = ui.t('weather.humidity');
  for (var conditionName in CONDITIONS) if (Object.prototype.hasOwnProperty.call(CONDITIONS, conditionName)) CONDITIONS[conditionName].label = ui.t('weather.' + conditionName);
  var heroBox = document.getElementById('weather-hero');
  var heroGroup = '';
  var heroIndex = 0;
  var heroTimer = null;
  var heroTransition = null;
  var heroFrame = null;
  var heroPendingIndex = null;
  var heroGeneration = 0;
  var HERO_ROTATION_MS = 20000;
  function motionReduced() {
    return typeof window.matchMedia === 'function' && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  }
  function stopHeroRotation() {
    if (heroTimer !== null) window.clearTimeout(heroTimer);
    if (heroTransition !== null) window.clearTimeout(heroTransition);
    if (heroFrame !== null) window.cancelAnimationFrame(heroFrame);
    heroTimer = null;
    heroTransition = null;
    heroFrame = null;
    heroPendingIndex = null;
    heroGeneration += 1;
    if (!heroBox || !heroGroup) return;
    var sky = skyFor(heroGroup);
    var layers = heroBox.querySelectorAll('.weather-sky');
    for (var i = 0; i < layers.length; i += 1) layers[i].remove();
    var settled = element('div', 'weather-sky');
    settled.style.backgroundImage = sky.art;
    settled.style.opacity = '1';
    heroBox.insertBefore(settled, heroBox.firstChild);
  }
  function skyFor(group) {
    var choices = SKIES[group];
    if (!choices || !choices.length) return SKY_UNKNOWN;
    return choices[heroIndex % choices.length];
  }
  function scheduleHeroRotation() {
    if (!heroGroup || document.hidden || motionReduced() || !SKIES[heroGroup] || SKIES[heroGroup].length < 2) return;
    heroTimer = window.setTimeout(rotateHero, HERO_ROTATION_MS);
  }
  function rotateHero() {
    heroTimer = null;
    if (!heroBox || document.hidden || !heroGroup || motionReduced()) return;
    var choices = SKIES[heroGroup];
    if (!choices || choices.length < 2) return;
    var nextIndex = (heroIndex + 1) % choices.length;
    var next = choices[nextIndex];
    var generation = heroGeneration;
    var preloaded = new Image();
    preloaded.onload = function () {
      if (generation !== heroGeneration || heroGroup === '' || document.hidden) return;
      var old = heroBox.querySelector('.weather-sky');
      var layer = element('div', 'weather-sky');
      layer.style.backgroundImage = next.art;
      layer.style.opacity = '0';
      heroBox.insertBefore(layer, heroBox.firstChild);
      heroPendingIndex = nextIndex;
      heroFrame = window.requestAnimationFrame(function () {
        heroFrame = null;
        if (generation !== heroGeneration) return;
        heroIndex = nextIndex;
        heroPendingIndex = null;
        layer.style.opacity = '1';
        if (old) old.style.opacity = '0';
        paintHero(heroGroup);
      });
      heroTransition = window.setTimeout(function () {
        if (generation !== heroGeneration) return;
        var layers = heroBox.querySelectorAll('.weather-sky');
        for (var i = 1; i < layers.length; i += 1) layers[i].remove();
        heroTransition = null;
        paintHero(heroGroup);
        scheduleHeroRotation();
      }, 380);
    };
    preloaded.onerror = function () { if (generation === heroGeneration) scheduleHeroRotation(); };
    // The palette serializes each source as url("..."); load only its data URI.
    preloaded.src = next.art.slice(5, -2);
  }
  function resumeHeroRotation() {
    if (!document.hidden && heroGroup && heroTimer === null && heroTransition === null) scheduleHeroRotation();
  }
  function paintHero(group) {
    if (!heroBox) return;
    if (group !== heroGroup) {
      stopHeroRotation();
      heroGroup = group;
      heroIndex = 0;
      while (heroBox.firstChild) heroBox.removeChild(heroBox.firstChild);
    }
    var sky = skyFor(group);
    heroBox.setAttribute('data-sky', group);
    if (!heroBox.querySelector('.weather-sky')) {
      var painting = element('div', 'weather-sky');
      painting.style.backgroundImage = sky.art;
      heroBox.appendChild(painting);
      scheduleHeroRotation();
    }
    var oldDetails = heroBox.querySelectorAll('.weather-scrim,.weather-hero-type');
    for (var i = 0; i < oldDetails.length; i += 1) oldDetails[i].remove();
    var type = element('div', 'weather-hero-type');
    type.style.color = sky.ink;
    var named = element('p', 'weather-place', place.name);
    named.style.color = sky.cityInk;
    type.appendChild(named);
    if (reading) {
      if (sky.scrim) {
        var wash = element('div', 'weather-scrim');
        wash.style.backgroundImage = sky.scrim;
        heroBox.insertBefore(wash, heroBox.querySelector('.weather-button'));
      }
      type.appendChild(element('p', 'weather-now', degrees(reading.temperature)));
      if (group) type.appendChild(element('p', 'weather-word', CONDITIONS[group].label));
      var measured = metaLine(reading);
      if (measured) type.appendChild(element('p', 'weather-meta', measured));
    }
    heroBox.insertBefore(type, heroBox.querySelector('.weather-button'));
  }
  function buildReading() {
    var group = reading ? weatherGroup(reading.code) : '';
    var controls = buildControls();
    paintHero(group);
    if (heroBox) {
      var freshButton = controls.querySelector('.weather-button');
      var existingButton = heroBox.querySelector('.weather-button');
      if (existingButton && freshButton) {
        existingButton.disabled = freshButton.disabled;
        existingButton.setAttribute('aria-label', freshButton.getAttribute('aria-label') || '');
        existingButton.innerHTML = freshButton.innerHTML;
        freshButton.remove();
      } else if (freshButton) {
        heroBox.appendChild(freshButton);
      }
    }
    var wrap = element('div', 'weather-reading');
    if (reading && reading.days.length) {
      var list = element('ul', 'weather-days');
      for (var i = 0; i < reading.days.length; i += 1) list.appendChild(dayRow(reading.days[i]));
      wrap.appendChild(list);
    }
    wrap.appendChild(controls);
    return wrap;
  }
  document.addEventListener('visibilitychange', function () {
    if (document.hidden) stopHeroRotation();
    else resumeHeroRotation();
  });
  window.addEventListener('pagehide', stopHeroRotation);
  function render() {
    while (face.firstChild) face.removeChild(face.firstChild);
    face.appendChild(place ? buildReading() : buildWaiting());
    noticeLine.textContent = message || (probed && !reachable ? NEEDS_HOST : '');
  }
  // Nothing is written back from here. Reading the same stored card twice gives
  // the same answer twice, so a card that is only opened and looked at leaves
  // nothing behind.
  //
  // A place is a name plus, usually, a pair of coordinates. The name is what
  // makes it a place at all — a card holding two numbers and nothing to call
  // them is a card that cannot say where it is looking — while the coordinates
  // may be missing, because an agent is allowed to cast a card knowing only
  // that the reader meant Kyoto. A reading is only taken back with coordinates
  // beside it: one that arrived without them belongs to a place this card has
  // not finished identifying, and it would be describing somewhere unproven.
  function restore(stored) {
    if (!stored || typeof stored !== 'object') return;
    var saved = stored.place && typeof stored.place === 'object' ? stored.place : null;
    var name = saved && typeof saved.name === 'string' ? saved.name.trim() : '';
    if (!name) return;
    var latitude = numberIn(saved.latitude);
    var longitude = numberIn(saved.longitude);
    place = { name: name, latitude: latitude, longitude: longitude };
    if (latitude === null || longitude === null) return;
    reading = readingIn(stored.reading);
    fetchedAt = reading ? numberIn(stored.fetchedAt) : null;
  }
  // Both answers have to be in before the card can act: one says whether it may
  // ask for anything, the other says where it left off. Whichever lands second
  // starts the opening request, so a card that was cast with a place shows the
  // weather without being asked. Neither answer failing changes that — the card
  // simply finds it has nothing it can do.
  function ready() {
    answered += 1;
    if (answered !== 2) return;
    render();
    start();
  }
  render();
  if (api && typeof api.capabilities === 'function') {
    api.capabilities().then(function (envelope) {
      var result = envelope && envelope.ok === true ? envelope.result : null;
      var capabilities = result && result.capabilities ? result.capabilities : null;
      var invokeWord = capabilities && typeof capabilities.invoke === 'string' ? capabilities.invoke : '';
      var stateWord = capabilities && typeof capabilities.state === 'string' ? capabilities.state : '';
      reachable = invokeWord === 'available' || invokeWord === 'local_fallback';
      writable = stateWord === 'available' || stateWord === 'local_fallback';
      probed = true;
      ready();
    }, function () { probed = true; ready(); });
  } else {
    probed = true;
    ready();
  }
  if (api && api.state && typeof api.state.get === 'function') {
    api.state.get().then(function (envelope) {
      var result = envelope && envelope.ok === true ? envelope.result : null;
      restore(result && result.state ? result.state.weather : null);
      ready();
    }, function () { ready(); });
  } else {
    ready();
  }
})();
</script>
</body>
</html>
