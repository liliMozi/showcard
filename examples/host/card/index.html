<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Developer host note</title>
<link rel="stylesheet" href="assets/style.css">
<script type="application/json" data-card-manifest>
{
  "spec": "1.0",
  "toolBindings": {
    "time": { "tool": "demo.time.now" }
  }
}
</script>
<script type="application/json" data-card-state>
{ "note": "This note is stored by the development host." }
</script>
</head>
<body>
<main class="card">
  <p class="eyebrow">showcard package</p>
  <h1>A real card package</h1>
  <label for="note">State stored by this host</label>
  <textarea id="note" data-persist="note" rows="5"></textarea>
  <div class="actions">
    <button type="button" data-invoke="time">Record the current time</button>
    <output data-result="time" aria-live="polite">No time recorded yet.</output>
  </div>
</main>
</body>
</html>
